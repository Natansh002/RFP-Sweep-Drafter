# Sweep, check and publish the public findings site (GitHub Pages). The team version runs
# on the internal host, behind company sign-in (docs/internal-hosting.md).
#
# The public copy is published only while GitHub Pages is available for this repository
# and the repository variable PUBLISH_PAGES is not "false". A private repository on a plan
# without Pages has none: then a push still runs every test, and a scheduled run (which
# exists only to refresh the public copy) does nothing. Set PUBLISH_PAGES to "false" to
# skip even the check.
#
# Runs on every push to main (a config change, or a spreadsheet committed to
# assignments/), every 6 hours, and on demand. Nothing publishes unless
# the config validates and every test passes, the same gate as validate.yml.
#
# The job only makes GET requests to public procurement pages (through
# lib/guard.mjs) and to this site's own previous build. It files nothing,
# sends nothing and links to no internal tool.

name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      width:
        description: "Channel width: 1 highest-yield, 2 normal, 3 everything"
        default: "2"
        required: false
      sweep:
        description: "Run the sweep (false = just re-publish with committed assignments)"
        default: "true"
        required: false
      fresh:
        description: "Fresh start: do not carry over the previously published findings"
        default: "false"
        required: false

# Least privilege: each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Is there a public copy to publish?
  gate:
    if: ${{ vars.PUBLISH_PAGES != 'false' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PAGES: ${{ vars.PUBLISH_PAGES }}
        run: |
          if [ "$PUBLISH_PAGES" = "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PUBLISH_PAGES is false, so the public copy is not published."
          elif gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2> /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not available for this repository (a private repository on a plan without Pages, or Pages switched off), so the public copy is not published. Set the repository variable PUBLISH_PAGES to false to skip this check."
          fi

  build:
    needs: gate
    # A scheduled run only refreshes the public copy: without one there is nothing to do.
    if: ${{ needs.gate.outputs.publish == 'true' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build, validate and test
        run: npm run check

      # Headless Chromium for portals that render listings with JavaScript.
      # A fresh profile every run; bot checks are reported, never bypassed.
      - name: Install headless browser
        run: npx playwright install --with-deps chromium

      # Every screen, button and filter, in a real browser, on both the published
      # build and the local dashboard. A broken screen never reaches the site.
      - name: End-to-end test
        run: npm run test:e2e

      - id: pages
        if: ${{ needs.gate.outputs.publish == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # The findings carry over between runs: from this cache, else from the published site.
      - name: Restore the findings store
        if: ${{ needs.gate.outputs.publish == 'true' && github.event.inputs.fresh != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            store/*.json
          key: rfp-store-${{ github.run_id }}
          restore-keys: rfp-store-

      - name: Restore, apply assignments, sweep, build site
        if: ${{ needs.gate.outputs.publish == 'true' }}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SWEEP_WIDTH: ${{ github.event.inputs.width || '2' }}
          # Solicitation documents read per industry run (recent readings are reused).
          RFP_DOCUMENTS_PER_RUN: "20"
          FRESH: ${{ github.event.inputs.fresh == 'true' && '1' || '0' }}
        run: |
          if [ "${{ github.event.inputs.sweep }}" = "false" ]; then
            node scripts/ci-sweep.mjs --no-sweep
          else
            node scripts/ci-sweep.mjs
          fi

      - name: Check the site before publishing
        if: ${{ needs.gate.outputs.publish == 'true' }}
        run: |
          test -s site/index.html
          test -s site/data/meta.json
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('site/data/meta.json','utf8'));
            for (const t of m.tenants) { if (!fs.existsSync('site/data/'+t.id+'.json')) throw new Error('missing '+t.id); }
            console.log('site ok:', m.tenants.map(t=>t.id+' '+t.findings).join(', '));
          "

      - name: Save the findings store
        if: ${{ needs.gate.outputs.publish == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            store/*.json
          key: rfp-store-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ needs.gate.outputs.publish == 'true' }}
        with:
          path: site

  deploy:
    needs: [gate, build]
    if: ${{ needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

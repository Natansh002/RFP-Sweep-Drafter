name: Validate config

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # No tokens, keys or connection strings in the repository (lib/secrets.mjs).
      - name: Secret check
        run: node scripts/check-secrets.mjs

      # A high or critical advisory in a runtime dependency stops the push.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate config
        run: node scripts/validate.mjs

      - name: Scorer regression tests
        run: node scripts/test-score.mjs

      # The workflows in n8n/ are generated. If a config or the scorer changed
      # without a rebuild, the committed workflow is stale and the sweep would
      # score differently from the desk. Fail on that rather than let it ship.
      - name: Check n8n/ is up to date
        run: |
          node scripts/build-workflows.mjs
          if ! git diff --quiet -- n8n/; then
            echo "::error::n8n/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- n8n/
            exit 1
          fi
